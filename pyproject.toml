[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repotrail"
version = "0.1.0"
description = "Map an unfamiliar Python repository and find a path into its code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
repotrail = "repotrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
